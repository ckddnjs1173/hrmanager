<!doctype html><html lang="ko"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{font-family:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo',sans-serif;
    background:linear-gradient(160deg,#F1F6FF 0%,#FFFFFF 62%);position:relative;color:#0B0D12}
  .bar{position:absolute;top:0;left:0;width:100%;height:12px;background:#2F6DF6}
  .wrap{padding:76px 84px}
  .logo{display:flex;align-items:center;gap:16px;margin-bottom:60px}
  .logo .ic{width:52px;height:52px;border-radius:15px;background:#2F6DF6;display:flex;align-items:center;justify-content:center}
  .logo .ic svg{width:30px;height:30px}
  .logo .nm{font-size:34px;font-weight:800;letter-spacing:-1px}
  .logo .nm b{color:#2F6DF6}
  .logo .sub{font-size:20px;font-weight:700;color:#8A9099;margin-left:2px}
  h1{font-size:74px;font-weight:800;line-height:1.16;letter-spacing:-2.5px}
  h1 .g{color:#2F6DF6}
  .desc{margin-top:30px;font-size:30px;font-weight:500;color:#4B5563;letter-spacing:-.5px}
  .foot{position:absolute;left:84px;bottom:70px;font-size:25px;font-weight:700;color:#2F6DF6;letter-spacing:-.5px}
</style></head>
<body>
  <div class="bar"></div>
  <div class="wrap">
    <div class="logo">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none"><path d="M6.5 11.5h11a1.5 1.5 0 0 1 1.5 1.5v5a1.5 1.5 0 0 1-1.5 1.5h-5.2L8.8 22.5v-2.5H6.5A1.5 1.5 0 0 1 5 18.5v-5.5A1.5 1.5 0 0 1 6.5 11.5Z" fill="#fff"/><circle cx="9.2" cy="15.7" r="1" fill="#2F6DF6"/><circle cx="12.2" cy="15.7" r="1" fill="#2F6DF6"/><circle cx="15.2" cy="15.7" r="1" fill="#2F6DF6"/></svg></span>
      <span class="nm">인사<b>야</b></span><span class="sub">노무 AI</span>
    </div>
    <h1>노무 문제,<br/><span class="g">AI가 먼저 정리</span>해요</h1>
    <div class="desc">임금체불·부당해고·퇴직금 — 예상 금액·다음 행동까지</div>
  </div>
  <div class="foot">⚖ 2026 법령 기준 · 무료 AI 상담</div>
</body></html>
