<!DOCTYPE html>

  <title>퇴직금·퇴직연금 사건 정리 · 인사야</title>
  <meta name="description" content="퇴직금·DB·DC형 퇴직연금을 사건 단위로 정리하고 평균임금, 예상 미지급액, 증거, 문서와 공식 절차를 확인합니다." />
  <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

  <link rel="stylesheet" href="/wage-workspace.css" />
  <link rel="stylesheet" href="/retirement-intake.css" />
</head>
<body>
  <header class="case-topbar">
    <a class="case-brand" href="/" aria-label="인사야 홈"><span class="case-brand-dot">●</span><span>인사야</span></a>
    <div class="case-topbar-center">내 사건</div>
    <a class="case-home-link" href="/">홈으로</a>
  </header>

  <main class="case-shell">
    <section class="case-hero retirement-hero">
      <div class="case-kicker">퇴직금·퇴직연금 · Case Workspace 베타</div>
      <h1>퇴직급여 유형부터 나누고<br />받아야 할 금액을 계산해요.</h1>
      <p>일반 퇴직금, DB형, DC형은 계산 기준이 다릅니다. 퇴직일은 마지막 근무일의 다음 날로 입력하고, 평균임금 제외기간이나 주 15시간 미만 기간이 있으면 별도로 보정합니다.</p>
    </section>

    <section id="retirementApp" class="case-app" aria-live="polite">
      <div class="case-loading"><div class="case-spinner" aria-hidden="true"></div><p>사건 화면을 준비하고 있어요.</p></div>
    </section>

    <section class="case-safety" aria-label="개인정보 및 계산 안내">
      <b>계산·개인정보 안내</b>
      <p>접근 토큰은 이 탭 세션에만 보관합니다. 평균임금 제외기간, 주 15시간 미만 기간, DB/DC 운용내역이 있으면 실제 퇴직급여는 추가 자료에 따라 달라질 수 있습니다.</p>
    </section>
  </main>

  <script type="module" src="/retirement-intake-client.js"></script>
