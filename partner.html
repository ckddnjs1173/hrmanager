<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>노무사 대시보드 · 노무AI</title>
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg" />
<link rel="stylesheet" href="assets/brand/app.css" />
<style>
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login{width:100%;max-width:400px}
  .pc-top{background:#fff;border-bottom:1px solid var(--line);padding:1rem 1.4rem;display:flex;align-items:center;gap:.6rem}
  .pc-top .b{color:var(--accent);font-weight:800}
  .pc-wrap{max-width:820px;margin:0 auto;padding:1.4rem 1.1rem}
  .bk-sum{margin-top:.5rem;background:var(--panel);border-radius:var(--r-sm);padding:.7rem .8rem;font-size:.86rem;white-space:pre-wrap;color:var(--ink-600)}
  .inline-in{border:1px solid var(--line);border-radius:var(--r-sm);padding:.4rem .55rem;font-family:inherit;font-size:.85rem;outline:none}
  .inline-in:focus{border-color:var(--accent)}
</style>
</head>
<body>

<div id="login" class="login-wrap">
  <div class="card login">
    <div class="h1">노무사 대시보드</div>
    <p class="muted small" style="margin:.2rem 0 1rem">운영자가 전달한 <b>접속 토큰</b>을 입력하거나, 받은 접속 링크로 들어오세요.</p>
    <label class="label" for="tok">접속 토큰</label>
    <input id="tok" class="input" type="password" placeholder="접속 토큰" onkeydown="if(event.key==='Enter')login()"/>
    <div id="loginErr" class="small" style="color:var(--danger-ink);margin-top:.5rem"></div>
    <button class="btn primary" style="width:100%;margin-top:.9rem" onclick="login()">로그인</button>
  </div>
</div>

<div id="app" style="display:none">
  <div class="pc-top"><span class="b">●</span> <b>노무AI</b> 노무사 <div style="flex:1"></div><span class="muted small" id="who"></span><button class="btn ghost sm" onclick="logout()" style="margin-left:10px">로그아웃</button></div>
  <div class="pc-wrap">
    <div class="stats" id="pstats" style="margin-bottom:18px"></div>
    <div class="tabs" id="ptabs" style="margin-bottom:14px"></div>
    <div id="list"></div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
let CSRF='', NAME='', BK=[], filter='active';
const STAT=[['received','접수','info'],['reviewed','검토완료','info'],['sent','전달됨','ok'],['in_progress','상담진행','info'],['done','완료','ok'],['canceled','취소','danger']];
const statLabel=s=>(STAT.find(x=>x[0]===s)||['',s])[1];
const statTone=s=>(STAT.find(x=>x[0]===s)||['','','']).at(2)||'';
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(d){ return (d||'').slice(0,16).replace('T',' '); }
function tel(c){ const d=String(c||'').replace(/[^\d+]/g,''); return d.length>=9?d:''; }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600); }
async function api(path,opt={}){ const headers={'Content-Type':'application/json',...(opt.headers||{})}; if(opt.method&&opt.method!=='GET') headers['x-csrf-token']=CSRF; return fetch(path,{credentials:'same-origin',...opt,headers}); }

async function login(){
  const token=(document.getElementById('tok').value||'').trim() || (location.hash.match(/token=([a-f0-9]+)/)||[])[1];
  if(!token){ document.getElementById('loginErr').textContent='토큰을 입력하세요.'; return; }
  try{
    const r=await fetch('/api/partner/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
    if(r.status===401){ document.getElementById('loginErr').textContent='유효하지 않은 토큰입니다. 운영자에게 재발급을 요청하세요.'; return; }
    if(r.status===429){ document.getElementById('loginErr').textContent='시도가 너무 많습니다. 잠시 후 다시.'; return; }
    if(!r.ok) throw 0; const d=await r.json(); CSRF=d.csrf; NAME=d.name||'';
    history.replaceState(null,'',location.pathname);
    await load();
  }catch(e){ document.getElementById('loginErr').textContent='서버 오류. 잠시 후 다시 시도하세요.'; }
}
async function logout(){ try{ await api('/api/partner/logout',{method:'POST'}); }catch(e){} location.reload(); }
async function boot(){
  const m=location.hash.match(/token=([a-f0-9]+)/);
  if(m){ login(); return; }
  try{ const r=await fetch('/api/partner/me',{credentials:'same-origin'}); if(r.ok){ const d=await r.json(); CSRF=d.csrf; NAME=d.name||''; await load(); return; } }catch(e){}
  document.getElementById('login').style.display='flex';
}
async function load(){
  try{
    const r=await api('/api/partner/bookings');
    if(r.status===401||r.status===403){ location.reload(); return; }
    BK=await r.json();
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('who').textContent=NAME?(NAME+' 님'):'';
    render();
  }catch(e){ document.getElementById('loginErr').textContent='상담 목록을 불러오지 못했어요.'; }
}
function render(){
  const active=BK.filter(b=>!['done','canceled'].includes(b.status));
  const done=BK.filter(b=>b.status==='done');
  document.getElementById('pstats').innerHTML=
    `<div class="stat accent"><div class="v">${active.length}</div><div class="k">진행할 상담</div></div>
     <div class="stat ok"><div class="v">${done.length}</div><div class="k">완료</div></div>
     <div class="stat"><div class="v">${BK.length}</div><div class="k">전체 배정</div></div>`;
  const tabs=[['active','진행 중',active.length],['done','완료',done.length],['all','전체',BK.length]];
  document.getElementById('ptabs').innerHTML=tabs.map(t=>`<button class="${filter===t[0]?'on':''}" onclick="filter='${t[0]}';render()">${t[1]} (${t[2]})</button>`).join('');
  const arr=filter==='active'?active:filter==='done'?done:BK;
  document.getElementById('list').innerHTML = arr.length? arr.map(card).join('')
    : `<div class="empty"><span class="ic">📭</span><div class="t">배정된 상담이 없어요</div><div class="small">운영자가 상담을 배정하면 여기에 표시됩니다.</div></div>`;
}
function card(b){
  const t=tel(b.contact);
  return `<div class="card">
    <div class="row" style="justify-content:space-between">
      <div class="row" style="gap:.5rem"><b style="font-size:1.05rem">${esc(b.name)||'(미입력)'}</b>
        <span class="badge ${statTone(b.status)} dot">${statLabel(b.status)}</span></div>
      <span class="muted small">${fmt(b.at)}</span>
    </div>
    <div class="row" style="gap:14px;margin-top:.3rem;font-size:.9rem">
      <span>📞 ${t?`<a href="tel:${t}">${esc(b.contact)}</a>`:esc(b.contact)||'-'}</span>
      ${b.message?`<span class="muted">${esc(b.message)}</span>`:''}
    </div>
    ${b.summary?`<div class="bk-sum">${esc(b.summary)}</div>`:''}
    <div class="row" style="margin-top:.8rem">
      ${b.status!=='done'?`<button class="btn sm ${b.status==='in_progress'?'':'primary'}" onclick="upd('${b.id}','status','in_progress')">상담 진행</button>
        <button class="btn sm" onclick="upd('${b.id}','status','done')">완료 처리</button>`:'<span class="badge ok">완료된 상담</span>'}
      <input class="inline-in" style="flex:1;min-width:140px" placeholder="메모" value="${esc(b.memo)}" onchange="upd('${b.id}','memo',this.value)"/>
    </div>
  </div>`;
}
async function upd(id,field,val){
  try{ const r=await api('/api/partner/booking/'+id,{method:'POST',body:JSON.stringify({[field]:val})});
    if(!r.ok) throw 0; const b=BK.find(x=>x.id===id); if(b)b[field]=val; toast('저장됨'); if(field==='status')render();
  }catch(e){ toast('저장 실패'); }
}
boot();
</script>
</body>
</html>
