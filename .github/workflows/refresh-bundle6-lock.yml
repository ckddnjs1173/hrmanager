name: Refresh Bundle 6 Lockfile

on:
  push:
    branches:
      - agent/bundle6-postgres-runtime

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/bundle6-postgres-runtime
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh postgres dependency lockfile"
          git push origin HEAD:agent/bundle6-postgres-runtime
