name: Advisor Collaboration CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: advisor-collaboration-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-advisor-collaboration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: insaya
          POSTGRES_PASSWORD: insaya_test
          POSTGRES_DB: insaya_advisor_ui
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insaya -d insaya_advisor_ui"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Business Case Document Security E2E
        env:
          DATABASE_URL: postgresql://insaya:insaya_test@127.0.0.1:5432/insaya_advisor_ui
        run: node scripts/business-case-document-security-e2e.mjs
      - name: Install Playwright runtime
        run: npm install --no-save --package-lock=false playwright@1.62.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Business to Advisor collaboration Chromium E2E
        env:
          DATABASE_URL: postgresql://insaya:insaya_test@127.0.0.1:5432/insaya_advisor_ui
        run: node scripts/advisor-collaboration-browser-e2e.mjs
