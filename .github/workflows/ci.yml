name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Release gate
        run: npm run release:check

  browser-e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install Playwright runtime
        run: npm install --no-save --package-lock=false playwright@1.62.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Chromium E2E
        run: |
          node scripts/browser-e2e.mjs
          node scripts/annual-leave-browser-e2e.mjs

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: browser-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify deployed commit, runtime readiness and production flow
        env:
          PRODUCTION_URL: https://insaya.onrender.com
          EXPECTED_COMMIT: ${{ github.sha }}
          DEPLOY_TIMEOUT_MS: 480000
        run: |
          node scripts/readiness-production-smoke.mjs
          node scripts/production-smoke.mjs
          node scripts/annual-leave-production-smoke.mjs
