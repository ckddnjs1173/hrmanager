name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Content integrity
        run: npm run content:check
      - name: Release safety
        run: node scripts/release-check.mjs

  postgres-runtime:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: insaya
          POSTGRES_PASSWORD: insaya_test
          POSTGRES_DB: insaya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insaya -d insaya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: PostgreSQL runtime E2E
        env:
          DATABASE_URL: postgresql://insaya:insaya_test@127.0.0.1:5432/insaya_test
        run: node scripts/postgres-runtime-e2e.mjs
      - name: SaaS Auth and Tenant E2E
        env:
          DATABASE_URL: postgresql://insaya:insaya_test@127.0.0.1:5432/insaya_test
        run: node scripts/saas-auth-tenant-e2e.mjs
      - name: Business onboarding E2E
        env:
          DATABASE_URL: postgresql://insaya:insaya_test@127.0.0.1:5432/insaya_test
        run: node scripts/business-onboarding-e2e.mjs
      - name: Business Risk and Action E2E
        env:
          DATABASE_URL: postgresql://insaya:insaya_test@127.0.0.1:5432/insaya_test
        run: node scripts/business-risk-e2e.mjs
      - name: Business Calendar E2E
        env:
          DATABASE_URL: postgresql://insaya:insaya_test@127.0.0.1:5432/insaya_test
        run: node scripts/business-calendar-e2e.mjs
      - name: Business Notification E2E
        env:
          DATABASE_URL: postgresql://insaya:insaya_test@127.0.0.1:5432/insaya_test
        run: node scripts/business-notification-e2e.mjs
      - name: Legal Change Governance E2E
        env:
          DATABASE_URL: postgresql://insaya:insaya_test@127.0.0.1:5432/insaya_test
        run: node scripts/legal-governance-e2e.mjs
      - name: Official Legal Source Monitor E2E
        env:
          DATABASE_URL: postgresql://insaya:insaya_test@127.0.0.1:5432/insaya_test
        run: node scripts/legal-source-monitor-e2e.mjs
      - name: External Advisor ShareGrant Foundation E2E
        env:
          DATABASE_URL: postgresql://insaya:insaya_test@127.0.0.1:5432/insaya_test
        run: node scripts/external-advisor-sharegrant-foundation-e2e.mjs
      - name: External Advisor ShareGrant Repository E2E
        env:
          DATABASE_URL: postgresql://insaya:insaya_test@127.0.0.1:5432/insaya_test
        run: node scripts/external-advisor-sharegrant-repository-e2e.mjs
      - name: Business Case Foundation E2E
        env:
          DATABASE_URL: postgresql://insaya:insaya_test@127.0.0.1:5432/insaya_test
        run: node scripts/business-case-foundation-e2e.mjs
      - name: External Advisor Collaboration Service E2E
        env:
          DATABASE_URL: postgresql://insaya:insaya_test@127.0.0.1:5432/insaya_test
        run: node scripts/external-advisor-collaboration-service-e2e.mjs

  business-browser-e2e:
    needs: [check, postgres-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: insaya
          POSTGRES_PASSWORD: insaya_test
          POSTGRES_DB: insaya_business_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insaya -d insaya_business_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install Playwright runtime
        run: npm install --no-save --package-lock=false playwright@1.62.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Business workspace Chromium E2E
        env:
          DATABASE_URL: postgresql://insaya:insaya_test@127.0.0.1:5432/insaya_business_browser
        run: node scripts/business-workspace-browser-e2e.mjs

  browser-e2e:
    needs: [check, postgres-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install Playwright runtime
        run: npm install --no-save --package-lock=false playwright@1.62.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Chromium E2E
        run: |
          node scripts/browser-e2e.mjs
          node scripts/annual-leave-browser-e2e.mjs
          node scripts/case-a11y-browser-e2e.mjs

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [browser-e2e, business-browser-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify deployed commit, runtime readiness and production flow
        env:
          PRODUCTION_URL: https://insaya.onrender.com
          EXPECTED_COMMIT: ${{ github.sha }}
          DEPLOY_TIMEOUT_MS: 480000
        run: |
          node scripts/readiness-production-smoke.mjs
          node scripts/production-smoke.mjs
          node scripts/annual-leave-production-smoke.mjs
