name: Business Case Document CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: business-case-document-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  document-repository-security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: insaya
          POSTGRES_PASSWORD: insaya_test
          POSTGRES_DB: insaya_document_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insaya -d insaya_document_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Business Case Document Foundation E2E
        env:
          DATABASE_URL: postgresql://insaya:insaya_test@127.0.0.1:5432/insaya_document_test
        run: node scripts/business-case-document-foundation-e2e.mjs
      - name: Business Case Document Repository Security E2E
        env:
          DATABASE_URL: postgresql://insaya:insaya_test@127.0.0.1:5432/insaya_document_test
        run: node scripts/business-case-document-repository-e2e.mjs
      - name: Business Case Document HTTP API E2E
        env:
          DATABASE_URL: postgresql://insaya:insaya_test@127.0.0.1:5432/insaya_document_test
        run: node scripts/business-case-document-api-e2e.mjs
      - name: Private Document Storage Security Foundation E2E
        env:
          DATABASE_URL: postgresql://insaya:insaya_test@127.0.0.1:5432/insaya_document_test
        run: node scripts/business-case-document-storage-foundation-e2e.mjs
