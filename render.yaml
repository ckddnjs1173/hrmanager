# Render Blueprint — https://render.com/docs/blueprint-spec
# 사용법: GitHub에 올린 뒤 Render에서 "New + → Blueprint"로 이 저장소를 선택하면 자동 구성됩니다.
services:
  - type: web
    name: insaya
    runtime: node
    plan: free                 # 무료 플랜(일정 시간 미사용 시 절전 → 첫 접속 시 콜드스타트)
    buildCommand: npm install && npm run build   # 의존성 설치 + 정적 SEO 페이지 생성
    startCommand: npm start
    # /api/health는 rate limit 바깥의 가벼운 liveness probe.
    # 상세 DB/Case/Legal readiness는 /api/readiness가 제공하며 main production smoke가 exact SHA와 함께 검증한다.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"            # node:sqlite + online backup API 사용 가능
      # AI provider 자동 선택: ANTHROPIC_API_KEY 있으면 Claude, 없고 GEMINI_API_KEY 있으면 Gemini, 둘 다 없으면 데모.
      - key: ANTHROPIC_API_KEY
        sync: false            # (선택) Claude 사용 시. 비우면 아래 Gemini로 폴백
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-8
      - key: GEMINI_API_KEY
        sync: false            # Google AI Studio 키. 대시보드에서 입력 → Gemini로 AI 동작
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_API_KEY
        sync: false            # (폴백) 있으면 provider 한도 초과 시 폴백 가능
      - key: GROQ_MODEL
        value: qwen/qwen3-32b
      - key: ADMIN_TOKEN
        generateValue: true    # 운영자 대시보드 토큰 자동 생성(대시보드에서 확인)
      - key: SESSION_SECRET
        generateValue: true    # 세션 쿠키 서명 키 자동 생성
      - key: DOCUMENT_STORAGE_SECRET
        generateValue: true    # Business Case 문서 AES-256-GCM 암호화 키 파생용. 임의 회전 금지
      - key: SITE_URL
        sync: false            # 비워두면 빌드 시 RENDER_EXTERNAL_URL 자동 사용
      - key: REQUIRE_PERSISTENT_DB
        value: "0"             # 무료 플랜에서는 영속 저장을 강제하지 않음. GA durable storage 전환 시 1
      - key: PERSISTENT_STORAGE
        value: "0"             # restart/redeploy 데이터 유지 검증을 끝낸 뒤에만 1

# 중요: 현재 무료 플랜의 파일시스템은 장기 영속 저장을 전제로 하지 않습니다.
# Case·예약·리드 등 운영 데이터는 SQLite DB 파일에 저장되므로 장기 운영 전 영속 저장소가 필요합니다.
# Business Case 문서 원본은 SAAS/PostgreSQL 런타임에서 평문 파일시스템이 아니라 암호화된 PostgreSQL bytea로 저장합니다.
# 유료 persistent disk를 선택할 경우 예시:
#    disk:
#      name: data
#      mountPath: /opt/render/project/src/data
#      sizeGB: 1
# 그리고 환경변수:
#   DB_PATH=/opt/render/project/src/data/app.db
#   REQUIRE_PERSISTENT_DB=1
#   PERSISTENT_STORAGE=1   # 실제 restart/redeploy survival test를 통과한 뒤에만 설정
# 전환 후 npm run db:backup / db:restore-check 및 재시작·재배포 데이터 유지 검증을 수행하세요.
