# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: insaya
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-8
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3-32b
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: DOCUMENT_STORAGE_SECRET
        generateValue: true
      - key: SITE_URL
        sync: false
      # Optional production SaaS email delivery. Leave provider blank until domain/from/API key are ready.
      - key: SAAS_EMAIL_PROVIDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SAAS_EMAIL_FROM
        sync: false
      - key: REQUIRE_PERSISTENT_DB
        value: "0"
      - key: PERSISTENT_STORAGE
        value: "0"

# 중요: 현재 무료 플랜 파일시스템은 장기 영속 저장을 전제로 하지 않습니다.
# Business Case 문서 원본은 SaaS/PostgreSQL 런타임에서 AES-256-GCM 암호화 bytea로 저장합니다.
# SAAS_EMAIL_PROVIDER는 자동 활성화하지 않습니다. verified domain/from/API key와 SITE_URL을 검증한 뒤 운영자가 명시적으로 설정합니다.
# SaaS 자체도 별도의 SAAS_ENABLED/STORAGE_DRIVER/DATABASE_URL/SAAS_SESSION_SECRET 준비가 끝나기 전에는 활성화하지 않습니다.
